name: Build Arise
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run automated tests
        run: |
          pip install pytest pyaes certifi
          python -m pytest -q tests

  apk:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython==0.29.36" virtualenv setuptools

      - name: Restore Android tools cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: buildozer-v3-${{ runner.os }}-

      - name: Prepare patched python-for-android (adds Arise services to the manifest)
        run: |
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git "$HOME/p4a-src"
          python - <<'PY'
          import os
          p = os.path.expanduser('~/p4a-src/pythonforandroid/bootstraps/sdl2/build/templates/AndroidManifest.tmpl.xml')
          s = open(p).read()
          svc = open('extra_application.xml').read()
          assert s.count('</application>') == 1
          open(p, 'w').write(s.replace('</application>', svc + '\n    </application>'))
          print('manifest template patched')
          PY
          sed -i '/^p4a.branch/d' buildozer.spec
          sed -i "s|^android.api = 33|p4a.source_dir = $HOME/p4a-src\nandroid.api = 33|" buildozer.spec
          grep -n "p4a" buildozer.spec
          rm -rf .buildozer/android/platform/build-*/dists

      - name: Build APK
        run: |
          set +e
          { java -version 2>&1 | head -2; echo "--- buildozer.spec (effective)"; grep -vE '^\s*(#|$)' buildozer.spec; echo "--- build start"; } > build.log
          export PYTHONUNBUFFERED=1
          python -m pip --version >> build.log 2>&1
          python -m pip install -q --user appdirs "colorama>=0.3.3" jinja2 "sh>=1.10, <2.0; sys_platform!='win32'" build toml packaging setuptools >> build.log 2>&1
          echo "pre-install exit code: $?" >> build.log
          buildozer -v android debug >> build.log 2>&1
          code=$?
          echo "buildozer exit code: $code" >> build.log
          tail -n 25 build.log
          exit $code

      - name: Check Android SDK before caching
        id: sdk
        if: always()
        run: |
          D="$HOME/.buildozer/android/platform/android-sdk"
          if [ -x "$D/tools/bin/sdkmanager" ] || [ -x "$D/cmdline-tools/latest/bin/sdkmanager" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Save Android tools cache
        if: always() && steps.sdk.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v3-${{ runner.os }}-${{ github.run_id }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arise-apk
          path: bin/*.apk

      - name: Publish APK to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" bin/*.apk \
            --title "Arise APK (build ${{ github.run_number }})" \
            --notes "Debug APK built from commit ${{ github.sha }}"

      - name: Publish log summary to build-logs branch
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p /tmp/lg
          touch build.log
          sed 's/\x1b\[[0-9;]*m//g' build.log > /tmp/clean.log || true
          {
            echo "run=${{ github.run_id }} sha=${{ github.sha }} status=$JOB_STATUS lines=$(wc -l < /tmp/clean.log)"
            echo "=== FIRST 45 LINES"
            head -n 45 /tmp/clean.log
            echo "=== WHAT WENT WRONG (gradle)"
            grep -n -B3 -A25 "What went wrong" /tmp/clean.log | head -90
            echo "=== ERROR LINES"
            grep -n -iE "error|exception|failed|failure|not found|no such file|cannot find|unable|licen|invalid" /tmp/clean.log | grep -v -E "Compiling|adding:|copy |warning:" | tail -60
            echo "=== LAST 90 LINES (unfiltered)"
            tail -n 90 /tmp/clean.log
          } > /tmp/lg/build-log.txt 2>&1 || echo "log summary failed" > /tmp/lg/build-log.txt
          cd /tmp/lg
          git init -q && git checkout -q -b build-logs
          git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -q -m "build log ${{ github.run_id }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs

  exe:
    needs: [test, apk]
    runs-on: windows-latest
    continue-on-error: true      # best effort: a Windows failure never blocks the APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Windows executable
        shell: bash
        run: |
          set +e
          {
            pip install "kivy[base]==2.3.0" "pyinstaller==6.6.0" "pyinstaller-hooks-contrib==2024.5" pyaes certifi plyer pillow
            pyinstaller --noconfirm --onefile --windowed --name Arise --add-data "ui.kv;." --add-data "assets;assets" --additional-hooks-dir hooks --hidden-import arise.adapters.android --hidden-import arise.adapters.desktop --hidden-import arise.adapters.ios --hidden-import plyer.platforms.win.notification --hidden-import plyer.platforms.win.tts main.py
          } > exe.log 2>&1
          code=$?
          tail -n 30 exe.log
          mkdir -p /tmp/lgx && { echo "exit=$code"; tail -n 80 exe.log; } > /tmp/lgx/exe-log.txt
          cd /tmp/lgx && git init -q && git checkout -q -b build-logs-exe && git config user.name github-actions && git config user.email actions@github.com && git add -A && git commit -q -m "exe log" && git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs-exe
          exit $code
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: arise-windows-exe
          path: dist/Arise.exe
      - name: Attach exe to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "apk-${{ github.run_number }}" dist/Arise.exe --clobber
